AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

Layout/LineLength:
  Max: 120

Metrics/BlockLength:
  Max: 35
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Max: 36
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 170

Metrics/CyclomaticComplexity:
  Max: 20

Metrics/MethodLength:
  Max: 40

Metrics/ParameterLists:
  Max: 6

Metrics/PerceivedComplexity:
  Max: 20

Naming/VariableNumber:
  AllowedIdentifiers:
    - iso_week_53

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes
